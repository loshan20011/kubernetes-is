# templates/wait-for-pvc-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-pvc
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
        - name: wait
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              PVC_NAME="{{ include "pv-pvc.fullname" . }}" # Use subchart's fullname helper
              NAMESPACE="{{ .Release.Namespace }}"
              echo "Waiting up to 5m for PVC $PVC_NAME in namespace $NAMESPACE to be Bound..."
              if kubectl wait pvc "$PVC_NAME" -n "$NAMESPACE" --for=condition=Bound --timeout=1m; then
                echo "PVC $PVC_NAME is Bound!"
                exit 0
              else
                echo "Error: Timeout waiting for PVC $PVC_NAME to become Bound." >&2
                # Optional: Get PVC details for debugging
                kubectl get pvc "$PVC_NAME" -n "$NAMESPACE" -o yaml
                exit 1
              fi
      restartPolicy: Never