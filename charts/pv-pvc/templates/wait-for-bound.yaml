# templates/wait-for-pvc-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-pvc
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
        - name: wait
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              # --- Use the CORRECT helper template defined in the parent chart ---
              PVC_NAME="{{ include "..fullname" . }}"
              # ---
              NAMESPACE="{{ .Release.Namespace }}"
              echo "Waiting up to 5m for PVC $PVC_NAME in namespace $NAMESPACE to be Bound..."
              # Using kubectl wait is cleaner
              if kubectl wait pvc "$PVC_NAME" -n "$NAMESPACE" --for=condition=Bound --timeout=1m; then
                echo "PVC $PVC_NAME is Bound!"
                exit 0
              else
                echo "Error: Timeout waiting for PVC $PVC_NAME to become Bound." >&2
                # Log details on failure
                kubectl get pvc "$PVC_NAME" -n "$NAMESPACE" -o yaml
                exit 1
              fi
      restartPolicy: Never